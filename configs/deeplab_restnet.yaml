experiment_name: deeplabv3plus_resnet34_baseline

model:
  encoder: resnet34              # dari efficientnet-b0 → resnet34
  encoder_weights: imagenet
  num_classes: 4

training:
  epochs: 70
  batch_size: 16                 # sama
  learning_rate: 0.007           # sama
  momentum: 0.9                  # sama
  weight_decay: 0.0001           # sama
  num_workers: 4                 # sama
  save_every_n_epochs: 5

scheduler:
  type: poly
  power: 0.9

loss:
  use_ce: true
  use_dice: true
  class_weights: [0.2, 5.0, 2.0, 2.5]   # sama

data:
  train_dir: D:/cyclone/dataset/train
  image_size: 512


output:
  checkpoint_dir: checkpoints/resnet34
  log_dir: outputs/resnet34/logs
  result_dir: /outputs/resnet34/results